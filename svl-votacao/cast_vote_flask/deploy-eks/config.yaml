apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eleicoes-cluster-ec2-1
  region: us-west-2
  version: '1.18'

nodeGroups:
  - name: ng-1
    instanceType: m5.large
    desiredCapacity: 1

availabilityZones: ['us-west-2a', 'us-west-2b', 'us-west-2c']

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]