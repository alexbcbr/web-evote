AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  svl-votacao

Globals:
  Function:
    Timeout: 3
    Runtime: python3.8
    Tracing: Active
    Environment:
      Variables:
        TRACE_LEVEL: INFO

Resources:
  TraceLevelParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Name: 'tracelevel'
      Description: 'Level of trace for Lambda Function'
      Type: String
      Value: 'INFO'

  SQSQueueLegacyVoting:
    Type: AWS::SQS::Queue

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      TracingEnabled: true

  VotarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cast_vote/
      Handler: app.handler
      Events:
        SubmeterGET:
          Type: Api
          Properties:
            Path: /vote/{num_candidato}
            Method: get
            RestApiId:
              Ref: ApiGateway
      Policies:
        - DynamoDBWritePolicy:
            TableName: 
              Ref: EleicoesTable
        - SQSSendMessagePolicy:
            QueueName:
              'Fn::GetAtt': SQSQueueLegacyVoting.QueueName
        - SSMParameterReadPolicy:
            ParameterName:
              Ref: TraceLevelParameterStore
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SQSQueueLegacyVoting

  EleicoesTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::Sub': 'EleicoesPresidente'
      AttributeDefinitions:
        - AttributeName: eleitor
          AttributeType: S
        - AttributeName: candidato
          AttributeType: S
      KeySchema:
        - AttributeName: eleitor
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: candidato
          KeySchema:
            - AttributeName: candidato
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  CastVoteLambda:
    Description: "Lambda para votacao"
    Value: !Ref VotarFunction

  CastVoteApi:
    Description: "API Gateway endpoint URL para votacao"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/vote/"

  SQSQueue:
    Description: "SQS Queue to publish vote"
    Value: !Ref SQSQueueLegacyVoting