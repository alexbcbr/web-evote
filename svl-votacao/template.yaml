AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  svl-votacao

Globals:
  Function:
    Timeout: 3
    Runtime: python3.8
    Tracing: Active

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  VotarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cast_vote/
      Handler: app.handler
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /vote
            Method: get
            RestApiId:
              Ref: ApiGateway
      Policies:
        - DynamoDBWritePolicy:
            TableName: 
              Ref: EleicoesTable


  EleicoesTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::Sub': 'EleicoesPresidente'
      AttributeDefinitions:
        - AttributeName: eleitor
          AttributeType: S
        - AttributeName: candidato
          AttributeType: S
      KeySchema:
        - AttributeName: eleitor
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: candidato
          KeySchema:
            - AttributeName: candidato
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  CastVoteApi:
    Description: "API Gateway endpoint URL para votacao"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/vote/"