AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  svl-votacao

Globals:
  Function:
    Timeout: 3
    Runtime: python3.8
    Tracing: Active

Resources:
  CastVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: cast_vote/
      Handler: app.handler
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /vote
            Method: get
      Policies:
        - DynamoDBWritePolicy:
            TableName: 
              Ref: ElectionsRecordTable
  
  ElectionsRecordTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName:
        'Fn::Sub': 'EleicoesPresidente'
      AttributeDefinitions:
        - AttributeName: eleitor
          AttributeType: S
        - AttributeName: candidato
          AttributeType: S
      KeySchema:
        - AttributeName: eleitor
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: candidato
          KeySchema:
            - AttributeName: candidato
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  CastVoteApi:
    Description: "API Gateway endpoint URL for Prod stage for the function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"
  CastVoteFunction:
    Description: "Function ARN"
    Value: !GetAtt CastVoteFunction.Arn
  CastVoteFunctionIamRole:
    Description: "Implicit IAM Role created for the function"
    Value: !GetAtt CastVoteFunctionRole.Arn
