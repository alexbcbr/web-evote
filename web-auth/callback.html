<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <div>
        The tokern to authenticase is: <span id="token"></span>
    </div>

    <script>
        (function init() {
            var id_token_str = window.location.hash.split("&access_token=")[0];
            var authorization_str = id_token_str.replace("#id_tokens=", "");
            document.getElementById("token").innerHTML = authorization_str;
        })();
    </script>
</body>
</html>
